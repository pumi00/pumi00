<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Iván Pérez — Full Stack Web Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#111a33"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#7c5cff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="blobA"><stop offset="0%" stop-color="#7c5cff" stop-opacity=".55"/><stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="blobB"><stop offset="0%" stop-color="#22d3ee" stop-opacity=".45"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="340" rx="22"/></clipPath>
    <style>
      .t{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:28px;fill:#e6edf3}
      .k{fill:#22d3ee}
      .h{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-weight:800;font-size:76px;letter-spacing:-1px}
      .s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:20px;fill:#8b949e;letter-spacing:3px}
      /* máquina de escribir: 3 frases en bucle de 12s */
      .w1{animation:w1 12s steps(28) infinite}
      .w2,.w3{clip-path:inset(0 100% 0 0)}
      .w2{animation:w2 12s steps(26) infinite}
      .w3{animation:w3 12s steps(28) infinite}
      @keyframes w1{0%,20%{clip-path:inset(0 0 0 0)}24%,88%{clip-path:inset(0 100% 0 0)}100%{clip-path:inset(0 0 0 0)}}
      @keyframes w2{0%,24%{clip-path:inset(0 100% 0 0)}36%,52%{clip-path:inset(0 0 0 0)}56%,100%{clip-path:inset(0 100% 0 0)}}
      @keyframes w3{0%,56%{clip-path:inset(0 100% 0 0)}68%,84%{clip-path:inset(0 0 0 0)}88%,100%{clip-path:inset(0 100% 0 0)}}
      .cur{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:18px;fill:#e6edf3;white-space:pre}
      .kw{fill:#ff7b72}.v{fill:#d2a8ff}.p{fill:#79c0ff}.st{fill:#a5d6ff}
      .float{animation:float 6s ease-in-out infinite}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
      .dot{animation:pulse 2s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <circle cx="180" cy="60" r="260" fill="url(#blobA)">
      <animate attributeName="cx" values="180;320;180" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;120;60" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="300" r="280" fill="url(#blobB)">
      <animate attributeName="cx" values="1040;900;1040" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="300;230;300" dur="10s" repeatCount="indefinite"/>
    </circle>

    <!-- ventana de terminal -->
    <g>
      <circle cx="70" cy="58" r="7" fill="#ff5f57"/><circle cx="94" cy="58" r="7" fill="#febc2e"/><circle cx="118" cy="58" r="7" fill="#28c840"/>
      <text x="146" y="64" class="s" style="font-size:15px;letter-spacing:1px">~/pumi00 — zsh</text>
    </g>

    <g>
      <text x="64" y="140" class="s">HI, I'M</text>
      <text x="60" y="215" class="h" fill="url(#name)">Iván Pérez</text>
    </g>

    <g>
      <text x="64" y="275" class="t"><tspan class="k">❯</tspan></text>
      <g transform="translate(96 0)">
        <text x="0" y="275" class="t w w1">Full Stack Web Developer</text>
        <text x="0" y="275" class="t w w2">Next.js · TypeScript · SQL</text>
        <text x="0" y="275" class="t w w3">Building real-world web apps</text>
      </g>
    </g>

    <!-- etiqueta "open to work" -->
    <g transform="translate(905 52)"><g>
      <rect width="230" height="40" rx="20" fill="#2ea44f" fill-opacity=".15" stroke="#2ea44f" stroke-opacity=".6"/>
      <circle class="dot" cx="24" cy="20" r="6" fill="#3fb950"/>
      <text x="42" y="26" class="s" style="fill:#3fb950;font-size:15px;letter-spacing:1.5px;font-weight:600">OPEN TO WORK</text>
    </g></g>

    <!-- tarjeta de código flotante -->
    <g transform="translate(760 118)"><g><g class="float">
      <rect width="375" height="178" rx="14" fill="#0d1117" fill-opacity=".85" stroke="#30363d"/>
      <text x="22" y="40" class="c"><tspan class="kw">const</tspan> <tspan class="v">ivan</tspan> = {</text>
      <text x="22" y="72" class="c">  <tspan class="p">stack</tspan>: [<tspan class="st">"Next.js"</tspan>, <tspan class="st">"TS"</tspan>],</text>
      <text x="22" y="104" class="c">  <tspan class="p">learning</tspan>: <tspan class="st">"always"</tspan>,</text>
      <text x="22" y="136" class="c">  <tspan class="p">coffee</tspan>: <tspan class="kw">true</tspan></text>
      <text x="22" y="164" class="c">};<tspan class="cur" fill="#22d3ee">▍</tspan></text>
    </g></g></g>
  </g>
</svg>
